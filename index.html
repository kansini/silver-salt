<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/assets/icon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f2e9" />
    <meta name="description" content="银盐 Silver Salt，一款情绪胶片相机。用胶片色彩、纸质相框与诗意标题，把平凡的今天拍成想念。在时光里显影。" />
    <meta property="og:title" content="银盐 Silver Salt · 在时光里显影" />
    <meta property="og:description" content="把平凡的今天，拍成想念。给日常，一点胶片的温度。" />
    <meta property="og:type" content="website" />
    <script>
      try {
        const saved = localStorage.getItem('silver-salt-theme');
        document.documentElement.dataset.theme = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      } catch {
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
    </script>
    <title>银盐 Silver Salt · 在时光里显影</title>
  </head>
  <body><div id="app"></div><script type="module" src="/src/main.ts"></script></body>
</html>
